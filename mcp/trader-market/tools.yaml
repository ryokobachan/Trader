          enum: [trader.talib.v1]
        engine:
          type: string
          enum: [TA-Lib]
        version:
          type: string
        times:
          type: array
          items:
            type: string
        barCount:
          type: number
        results:
          type: array
          items:
            type: object
            required: [id, name, group, parameters, inputs, lookback, series]
            additionalProperties: true
            properties:
              id:
                type: string
              name:
                type: string
              group:
                type: string
              parameters:
                type: object
                additionalProperties:
                  type: number
                properties: {}
              inputs:
                type: object
                additionalProperties:
                  anyOf:
                    - type: string
                    - type: array
