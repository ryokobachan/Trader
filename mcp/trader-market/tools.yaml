  get_options_history:
    dataset: options-history
    description: 指定したオプション契約の履歴を取得します。満期切れにも対応しますが、取得範囲は提供元の保存期間によります。建玉の公表時刻は未確認です。
    inputSchema:
      type: object
      required: [symbol]
      additionalProperties: false
      properties:
        symbol:
          type: string
          description: 銘柄コード（例：NVDA）
          pattern: ^[A-Z][A-Z0-9.-]{0,14}$
          maxLength: 2048
        contract:
          type: string
          description: OCC契約ID。これを指定するか、expiration・side・strikeの3つを指定します。
          maxLength: 2048
        expiration:
          type: string
          description: 満期日（YYYY-MM-DD）。満期切れも指定可能。side・strikeと併用し、contractと同時指定はできません。
          format: date
          maxLength: 2048
        side:
          type: string
          description: 権利種別。expiration・strikeと併用します。
          enum: [call, put]
          maxLength: 2048
        strike:
          type: string
          description: 正の権利行使価格。小数点以下3桁まで。expiration・sideと併用します。
          maxLength: 2048
        source:
          type: string
          description: 取得元。既定chartexchangeは四本値・出来高・建玉、yahooは四本値・出来高。
          enum: [chartexchange, yahoo]
          maxLength: 2048
        from:
          type: string
          description: 提供元の日付の開始日。当日を含みます。
          format: date
          maxLength: 2048
        to:
          type: string
          description: 提供元の日付の終了日。当日を含みます。
          format: date
          maxLength: 2048
    outputSchema: &history
      type: object
      required: [symbol, contractId, expiration, side, strike, underlying, source, sourceUrl, fetchedAt, sourceAsOf, currency, timezone, interval, requestedRange, priceAdjustment, adjustedCloseUsed, items, coverage]
      additionalProperties: true
      properties:
        symbol:
          type: string
        contractId:
          type: string
        expiration:
          type: string
        side:
          type: string
          enum: [call, put]
        strike:
          type: number
        underlying:
          type: object
          required: [symbol]
          additionalProperties: true
          properties:
            symbol:
              type: string
        source:
          type: string
          enum: [ChartExchange, Yahoo Finance]
        sourceUrl:
          type: string
        fetchedAt:
          type: string
        sourceAsOf:
          type: ['null', string]
        latestOptionPrice:
          type: number
        currency:
          type: string
          enum: [USD]
        timezone:
          type: string
        interval:
          type: string
          enum: [1d]
        requestedRange:
          type: string
          enum: [1y, available]
        openInterestDateBasis:
          type: string
          enum: [source_session_date_unverified]
        priceAdjustment:
          type: string
          enum: [source_ohlc]
        adjustedCloseUsed:
          type: boolean
          enum: [false]
        items:
          type: array
          items:
            type: object
            required: [date]
            additionalProperties: true
            properties:
              date:
                type: string
              time:
                type: number
              open:
                type: number
              high:
                type: number
              low:
                type: number
              close:
                type: number
              volume:
                type: number
              openInterest:
                type: number
        coverage:
          type: object
          required: [from, to, firstDate, lastDate, missingBars, sourceRows, returnedBars, observedBars]
          additionalProperties: true
          properties:
            from:
              type: string
            to:
              type: string
            firstDate:
              type: ['null', string]
            lastDate:
              type: ['null', string]
            missingBars:
              type: number
            sourceRows:
              type: number
            returnedBars:
              type: number
            observedBars:
              type: number
        requestWindow:
          type: object
          additionalProperties: true
          properties:
            from:
              type: string
            to:
              type: string
        filteredCoverage:
          type: object
          required: [firstDate, lastDate, returnedBars, observedBars, missingBars]
          additionalProperties: true
          properties:
            firstDate:
              type: ['null', string]
            lastDate:
              type: ['null', string]
            returnedBars:
              type: number
            observedBars:
              type: number
            missingBars:
              type: number
      description: 日付は提供元のラベルです。OHLCV・建玉の欠損項目は省略され、sourceAsOfや取得範囲はnullの場合があります。

  get_sec_filings:
    dataset: sec-filings
    description: SEC提出書類を取得します。symbolまたはcikを指定してください。過去の全書類の網羅は保証しません。
    inputSchema:
      type: object
      required: []
      additionalProperties: false
      properties:
        symbol:
          type: string
          description: 銘柄コード（例：NVDA）
          pattern: ^[A-Z][A-Z0-9.-]{0,14}$
          maxLength: 2048
        date:
          type: string
          description: 提出日の締切（YYYY-MM-DD）。過去の全提出書類は保証しません。
          format: date
          maxLength: 2048
        cik:
          type: string
          description: SEC CIK（1〜10桁）。symbolまたはcikが必要です。
          maxLength: 2048
    outputSchema: &direct
      type: object
      required: [sourceId, sourceName, sourceUrl, fetchedAt, columns, rows, coverage, notes]
      additionalProperties: true
      properties:
        sourceId:
          type: string
          enum: [sec-filings, sec-facts, sec-insiders, finra-short-volume, usaspending, fred, cnn-fear-greed]
        sourceName:
          type: string
        sourceUrl:
          type: string
        fetchedAt:
          type: string
        columns:
          type: array
          items:
            type: object
            required: [key, label, labelJa]
            additionalProperties: true
            properties:
              key:
                type: string
              label:
                type: string
              labelJa:
                type: string
              format:
                type: string
                enum: [number, url, date, text, ratio, usd]
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              type: ['null', string, number]
            properties: {}
        coverage:
          type: object
          required: [status, note]
          additionalProperties: true
          properties:
            status:
              type: string
              enum: [complete, partial, empty]
            note:
              type: string
            noteJa:
              type: string
        notes:
          type: array
          items:
            type: string
        notesJa:
          type: array
          items:
            type: string
      description: rowsの列名と表示形式はcolumnsで確認できます。欠損値はnullです。

