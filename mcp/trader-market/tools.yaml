    inputSchema:
      type: object
      required: [symbol]
      additionalProperties: false
      properties:
        symbol:
          type: string
          description: 銘柄コード（例：NVDA）
          pattern: ^[A-Z][A-Z0-9.-]{0,14}$
          maxLength: 2048
        indicators:
          type: string
          description: TA-Lib指標IDをカンマ区切りで指定。最大8個。既定RSI,MACD,ADX,CCI,MFI,BBANDS。
          maxLength: 2048
        parameters:
          type: string
          description: 指標IDごとの引数をJSON文字列で指定。例：{"RSI":{"timeperiod":21}}
          maxLength: 2048
        range:
          type: string
          description: 取得期間。既定は1y。
          enum: [1d, 5d, 1mo, 3mo, 6mo, 1y, 5y]
          maxLength: 2048
        interval:
          type: string
          description: 時間足。既定は1d。
          enum: [1m, 5m, 15m, 1h, 4h, 1d, 1wk, 1mo]
          maxLength: 2048
        count:
          type: integer
          description: 計算に使う足の最大本数。既定500。
          minimum: 2
          maximum: 10000
        fresh:
          type: boolean
          description: trueで提供元のメモリキャッシュを更新します。
    outputSchema: &technicals
      type: object
      required: [schemaVersion, engine, version, times, barCount, results, instrument, provenance, dataMode, inputBars, requestedCount, returnedCount, selectedProviders, range, interval]
      additionalProperties: true
      properties:
