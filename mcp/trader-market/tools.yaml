# 公開ツールの編集元。変更後はMCPを再接続してください。
# outputSchemaは成功時のstructuredContentの形式です。共通の形式はアンカーで共有します。
tools:

  get_quote:
    dataset: quote
    description: 現在の株価と銘柄情報を取得します。価格の日時・出典・dataModeを確認してください。
    inputSchema:
      type: object
      required: [symbol]
      additionalProperties: false
      properties:
        symbol:
          type: string
          description: 銘柄コード（例：NVDA）
          pattern: ^[A-Z][A-Z0-9.-]{0,14}$
          maxLength: 2048
    outputSchema: &quote
      type: object
      required: [schemaVersion, instrument, quote, selectedProviders, dataMode, asOf]
      additionalProperties: true
      properties:
        schemaVersion:
          type: string
          enum: [trader.symbol-summary.v1]
        instrument:
          type: object
          required: [instrumentId, symbol, name, assetType, active, listingCountry, exchange, exchangeMic, currency, provenance]
          additionalProperties: true
          properties:
            instrumentId:
              type: string
            symbol:
              type: string
            name:
              type: string
            assetType:
              type: string
              enum: [common_stock, adr]
            active:
              type: boolean
            listingCountry:
              type: string
              enum: [US]
            exchange:
              type: string
            exchangeMic:
              type: string
            currency:
              type: string
              enum: [USD]
            sector:
              type: string
            industry:
              type: string
            logoPath:
              type: string
            provenance:
              type: object
              required: [providerId, sourceId, asOf, ingestedAt]
              additionalProperties: true
              properties:
                providerId:
                  type: string
                sourceId:
                  type: string
                asOf:
                  type: string
                ingestedAt:
                  type: string
                sourceUrl:
                  type: string
                isStale:
                  type: boolean
                  enum: [false, true]
        quote:
          type: object
          required: [instrumentId, price, change, changePercent, previousClose, open, high, low, volume, currency, marketState, delaySeconds, provenance]
          additionalProperties: true
          properties:
            instrumentId:
              type: string
            price:
              type: number
            change:
              type: number
            changePercent:
              type: number
            previousClose:
              type: number
            open:
              type: number
            high:
              type: number
            low:
              type: number
            volume:
              type: number
            marketCap:
              type: number
            currency:
              type: string
              enum: [USD]
            marketState:
              type: string
              enum: [pre_market, regular, after_hours, closed]
            delaySeconds:
              type: number
            provenance:
              type: object
              required: [providerId, sourceId, asOf, ingestedAt]
              additionalProperties: true
              properties:
                providerId:
                  type: string
                sourceId:
                  type: string
                asOf:
                  type: string
                ingestedAt:
                  type: string
                sourceUrl:
                  type: string
                isStale:
                  type: boolean
                  enum: [false, true]
        selectedProviders:
          type: object
          required: [instrument, market]
          additionalProperties: true
          properties:
            instrument:
              type: string
            market:
              type: string
        dataMode:
          type: string
          enum: [fixture, provider]
        asOf:
          type: string

  get_ohlcv:
    dataset: bars
    description: 株価の四本値と出来高を取得します。要求した期間・本数を取得できない場合があります。
    inputSchema:
      type: object
      required: [symbol]
      additionalProperties: false
      properties:
        symbol:
          type: string
          description: 銘柄コード（例：NVDA）
          pattern: ^[A-Z][A-Z0-9.-]{0,14}$
          maxLength: 2048
        range:
          type: string
          description: 取得期間。既定は1y。
          enum: [1d, 5d, 1mo, 3mo, 6mo, 1y, 5y]
          maxLength: 2048
        interval:
          type: string
          description: 時間足。既定は1d。
          enum: [1m, 5m, 15m, 1h, 4h, 1d, 1wk, 1mo]
          maxLength: 2048
        count:
          type: integer
          description: 取得する足の最大本数。
          minimum: 2
          maximum: 10000
        fresh:
          type: boolean
          description: trueで提供元のメモリキャッシュを更新します。
    outputSchema: &bars
      type: object
      required: [schemaVersion, instrument, bars, requestedCount, returnedCount, selectedProviders, dataMode, asOf]
      additionalProperties: true
      properties:
        schemaVersion:
          type: string
          enum: [trader.market-bars.v1]
        instrument:
          type: object
          required: [instrumentId, symbol, name, assetType, active, listingCountry, exchange, exchangeMic, currency, provenance]
          additionalProperties: true
          properties:
            instrumentId:
              type: string
            symbol:
              type: string
            name:
              type: string
            assetType:
              type: string
              enum: [common_stock, adr]
            active:
              type: boolean
            listingCountry:
              type: string
              enum: [US]
            exchange:
              type: string
            exchangeMic:
              type: string
            currency:
              type: string
              enum: [USD]
            sector:
              type: string
            industry:
              type: string
            logoPath:
              type: string
            provenance:
              type: object
              required: [providerId, sourceId, asOf, ingestedAt]
              additionalProperties: true
              properties:
                providerId:
                  type: string
                sourceId:
                  type: string
                asOf:
                  type: string
                ingestedAt:
                  type: string
                sourceUrl:
                  type: string
                isStale:
                  type: boolean
                  enum: [false, true]
        bars:
          type: object
          required: [instrumentId, interval, range, adjustment, items, provenance]
          additionalProperties: true
          properties:
            instrumentId:
              type: string
            interval:
              type: string
              enum: [1m, 5m, 15m, 1h, 4h, 1d, 1wk, 1mo]
            range:
              type: string
              enum: [1d, 1mo, 5d, 3mo, 6mo, 1y, 5y]
            adjustment:
              type: string
              enum: [raw, split_adjusted, split_and_dividend_adjusted]
            items:
              type: array
              items:
                type: object
                required: [time, open, high, low, close, volume]
                additionalProperties: true
                properties:
                  time:
                    type: string
                  open:
                    type: number
                  high:
                    type: number
                  low:
                    type: number
                  close:
                    type: number
                  volume:
                    type: number
                  adjustedClose:
                    type: number
            requestedCount:
              type: number
            returnedCount:
              type: number
            provenance:
              type: object
              required: [providerId, sourceId, asOf, ingestedAt]
              additionalProperties: true
              properties:
                providerId:
                  type: string
                sourceId:
                  type: string
                asOf:
                  type: string
                ingestedAt:
                  type: string
                sourceUrl:
                  type: string
                isStale:
                  type: boolean
                  enum: [false, true]
        requestedCount:
          type: ['null', number]
        returnedCount:
          type: number
        selectedProviders:
          type: object
          required: [instrument, market]
          additionalProperties: true
          properties:
            instrument:
              type: string
            market:
              type: string
        dataMode:
          type: string
          enum: [fixture, provider]
        asOf:
          type: string

