[package]
name = "unicorn"
version = "0.1.0"
description = "A lightweight desktop workspace for U.S. stock analysis"
authors = ["Unicorn contributors"]
license = "Apache-2.0"
repository = "https://github.com/ryokobachan/Unicorn"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "unicorn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
getrandom = "0.3.4"
libc = "0.2.177"
serde_json = "1.0.145"
tauri = { version = "=2.11.5", default-features = false, features = ["wry", "compression"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
